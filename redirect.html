<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmeldung</title>
<style>body{margin:0;padding:24px 16px;font:16px/1.4 Arial,Helvetica,sans-serif;background:#f2f2f2;color:#000}</style>
</head>
<body>
<p id="msg">Anmeldung wird abgeschlossen …</p>
<!-- Rückkehrseite nach der Microsoft-Anmeldung (MSAL.js v5): gibt die Antwort an die App weiter -->
<script src="msal-redirect-bridge.min.js"></script>
<script>
  msalRedirectBridge.broadcastResponseToMainFrame().catch(function (e) {
    document.getElementById('msg').textContent = 'Anmeldung fehlgeschlagen: ' + (e && e.message || e) + ' – App neu öffnen.';
  });
</script>
</body>
</html>
